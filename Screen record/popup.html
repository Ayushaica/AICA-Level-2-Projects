<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOP Maker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="circle"></div>
        <h1>SOP Maker</h1>
      </div>
      <p class="subtitle">Effortless Screen Recording</p>
    </header>

    <main>
      <div class="input-group">
        <label for="userName">Prepared By</label>
        <input type="text" id="userName" placeholder="Enter your name" autocomplete="off" />
      </div>

      <div class="status-card" id="statusCard">
        <div class="pulse-indicator" id="pulseIndicator"></div>
        <span id="statusText">Ready to record</span>
        <span id="stepCount" class="step-badge" style="display: none;">0 steps</span>
      </div>

      <div class="action-buttons">
        <button id="startBtn" class="btn btn-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
          Start Recording
        </button>
        <button id="stopBtn" class="btn btn-danger" style="display: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect></svg>
          Stop & Generate PDF
        </button>
      </div>
    </main>
    
    <!-- Include jsPDF library -->
    <script src="libs/jspdf.umd.min.js"></script>
    <script src="popup.js"></script>
  </div>
</body>
</html>
